name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  HUSKY: 0
  EMSCRIPTEN_VERSION: '6.0.12'
  CLANG_FORMAT_VERSION: '23.1.3'
  CMAKE_VERSION: '4.4.4'
  NINJA_VERSION: '1.13.2'

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-format
        run: python -m pip install "clang-format==$CLANG_FORMAT_VERSION"

      - run: npm ci

      - name: Validate pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - run: npm run format

      - name: Verify formatting
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit formatted files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format files"
          git push

  test:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install CMake and Ninja
        run: python -m pip install "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: denoland/setup-deno@v2

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run configure:wasm
      - run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: docs/tests/coverage/lcov.info
          fail_ci_if_error: true

  release-please:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  publish:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install CMake and Ninja
        run: python -m pip install "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run configure:wasm
      - run: npm run build

      - name: Sync jsr.json version from package.json
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const jsr=JSON.parse(fs.readFileSync('jsr.json','utf8')); jsr.version=pkg.version; fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');"

      - name: Commit JSR version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jsr.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync JSR version"
          git push

      - run: npm publish --access public --ignore-scripts

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty
