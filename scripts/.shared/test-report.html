<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Automated Sequencer verification report across unit, convergence, stress, runtime, browser, and coverage suites."
    />
    <meta name="author" content="Jori Lehtinen" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sequencer test report</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        background: #000;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top,
            rgba(82, 168, 255, 0.15),
            transparent 32rem
          ),
          #000;
      }
      main {
        width: min(100%, 72rem);
        margin: 0 auto;
        padding: 1.25rem;
      }
      header,
      section {
        margin-bottom: 1rem;
        padding: clamp(1.25rem, 4vw, 2rem);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.4);
      }
      header {
        display: grid;
        gap: 1rem;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        max-width: 18ch;
        font-size: clamp(2.15rem, 7vw, 4.5rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }
      h2 {
        margin-bottom: 1.25rem;
        font-size: clamp(1.35rem, 4vw, 2rem);
      }
      .eyebrow,
      .metric span {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.25rem;
        color: rgba(255, 255, 255, 0.72);
      }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 1.9rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 750;
        white-space: nowrap;
      }
      .passed {
        color: #77e39b;
      }
      .failed {
        color: #ff8585;
      }
      .skipped {
        color: #ffd479;
      }
      .stage-grid,
      .metric-grid,
      .links {
        display: grid;
        gap: 0.75rem;
      }
      .stage,
      .metric,
      a {
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.025);
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .stage strong {
        font-size: 0.95rem;
      }
      .metric {
        display: grid;
        gap: 0.45rem;
      }
      .metric strong {
        font-size: 2rem;
      }
      .table-shell {
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 38rem;
      }
      th,
      td {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        text-align: left;
      }
      thead th {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      tbody tr:last-child th,
      tbody tr:last-child td {
        border-bottom: 0;
      }
      a {
        display: flex;
        justify-content: space-between;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        border-color: rgba(255, 255, 255, 0.35);
      }
      .note {
        margin-top: 1rem;
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.9rem;
        line-height: 1.55;
      }
      @media (min-width: 44rem) {
        main {
          padding: 2rem;
        }
        .stage-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .metric-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .links {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- REPORT -->
    </main>
  </body>
</html>
